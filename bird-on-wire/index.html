<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding: 10px;
  }
  .tool-wrap {
    max-width: 450px; margin: 0 auto; background: #ffffff;
    border-radius: 18px; box-shadow: 0 6px 22px rgba(21,101,192,0.16);
    overflow: hidden;
  }
  .title-bar {
    background: linear-gradient(135deg,#1565C0,#1976D2);
    color: #fff; font-size: 19px; font-weight: 700;
    text-align: center; padding: 16px 12px; letter-spacing: 0.5px;
  }
  .hint {
    font-size: 13px; padding: 11px 18px 4px;
    color: #666; text-align: center; line-height: 1.7;
  }
  .stage { position: relative; height: 285px; margin: 4px 12px 0; touch-action: none; }
  .wire {
    position: absolute; left: 8px; right: 8px; height: 5px;
    background: #4a4a4a; border-radius: 3px;
  }
  .wire.w1 { top: 62px; }
  .wire.w2 { top: 112px; }
  .wire .flow {
    position: absolute; inset: 0; border-radius: 3px;
    background: linear-gradient(90deg,#FFD54F,#FF7043,#FFD54F);
    background-size: 200% 100%; opacity: 0;
    transition: opacity .18s;
  }
  .wire.live .flow { opacity: 1; animation: run .7s linear infinite; }
  @keyframes run { to { background-position: -200% 0; } }
  .pole {
    position: absolute; left: 12%; top: 38px; width: 15px; height: 202px;
    margin-left: -7px; background: #8D6E63; border-radius: 3px;
  }
  .ground {
    position: absolute; left: 0; right: 0; top: 240px; height: 45px;
    background: linear-gradient(#A5D6A7,#81C784); border-radius: 0 0 10px 10px;
  }
  /* 位置框與電線都用 px，兩者才對得齊；margin 讓框以中心點對位 */
  .slot {
    position: absolute; width: 66px; height: 40px;
    margin-left: -33px; margin-top: -20px; z-index: 3;
    border: 2px dashed #90A4AE; border-radius: 10px;
    background: rgba(255,255,255,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #607D8B; line-height: 1.3; text-align: center;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .slot:hover, .slot.hot { border-color: #1565C0; background: #E3F2FD; }
  .slot.on { border-style: solid; border-color: #1565C0; background: #E3F2FD; }
  .bird {
    position: absolute; width: 44px; height: 44px; margin-left: -22px; margin-top: -38px;
    font-size: 34px; line-height: 44px; text-align: center;
    cursor: grab; user-select: none; z-index: 5;
    transition: left .22s cubic-bezier(.34,1.3,.64,1), top .22s cubic-bezier(.34,1.3,.64,1);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
  }
  .bird.dragging { cursor: grabbing; transition: none; }
  .bird.zap { animation: zap .4s ease-in-out 2; }
  @keyframes zap {
    0%,100% { transform: translateX(0) }
    25% { transform: translateX(-5px) rotate(-9deg) }
    75% { transform: translateX(5px) rotate(9deg) }
  }
  .verdict {
    margin: 10px 14px 0; border-radius: 12px; padding: 11px 14px;
    font-size: 15px; font-weight: 700; text-align: center;
    background: #ECEFF1; color: #546E7A; transition: background .2s, color .2s;
  }
  .verdict.safe { background: #E8F5E9; color: #2E7D32; }
  .verdict.live { background: #FFEBEE; color: #C62828; }
  .dialogue {
    display: flex; gap: 9px; align-items: flex-start;
    margin: 11px 14px 0; font-size: 14px; line-height: 1.75;
  }
  .dialogue .who { font-size: 26px; flex: 0 0 auto; }
  .dialogue .say {
    background: #F1F5F9; border-radius: 12px; padding: 9px 12px;
    color: #37474F; flex: 1 1 auto;
  }
  .progress {
    margin: 13px 14px 0; padding: 10px 12px; border-radius: 10px;
    background: #FFF8E1; font-size: 13px; color: #6D4C41; line-height: 1.8;
  }
  .progress b { color: #EF6C00; }
  .dots { letter-spacing: 3px; font-size: 15px; }
  .foot {
    padding: 12px 16px 16px; font-size: 12px;
    color: #90A4AE; text-align: center; line-height: 1.7;
  }
  .foot .warn { color: #C62828; font-weight: 700; }

<body>
<div class="tool-wrap">
  <div class="title-bar">接得起來嗎？</div>

  <div class="hint">
    電要<b>繞完一圈</b>才會流動。<br>
    把小鳥拖到不同的位置，看看電流會不會亮起來。
  </div>

  <div class="stage" id="stage">
    <div class="wire w1" id="w1"><div class="flow"></div></div>
    <div class="wire w2" id="w2"><div class="flow"></div></div>
    <div class="pole"></div>
    <div class="ground"></div>
    <div class="bird" id="bird">🐦</div>
  </div>

  <div class="verdict" id="verdict">把小鳥拖到一個位置試試看</div>

  <div class="dialogue">
    <div class="who" id="who">🐡</div>
    <div class="say" id="say">五個位置都試一次，你就會知道小鳥為什麼沒事。</div>
  </div>

  <div class="progress">
    試過的位置　<span class="dots" id="dots">○○○○○</span>　<b id="done">0</b> / 5<br>
    <span id="tip">其中有 <b>3 個</b> 會讓電流繞成一圈。</span>
  </div>

  <div class="foot">
    <span class="warn">⚠️ 真的電線一條都不能碰。</span><br>
    看到電線掉下來，離遠一點並打 1911。<br>
    小工具由電力爸爸開發，資料與說明見文章。
  </div>
</div>

<script>
(function () {
  "use strict";

  // 五個位置。live = 電流會不會繞成一圈
  // 這是本工具的全部知識：電要有「出去」和「回來」兩條路才會流動。
  // x 是 stage 寬度的百分比，y 是像素（跟電線同一套座標）
  var SPOTS = [
    { id: "same", x: 46, y: 62, live: false,
      label: "兩腳都在<br>同一條線",
      say: "兩隻腳站在同一條線上，電沒有第二條路可以走，所以不會流過牠。這就是小鳥沒事的原因。",
      who: "🐡" },
    { id: "cross", x: 80, y: 87, live: true,
      label: "一腳一條線<br>跨兩條",
      say: "圈圈接起來了！電從一條線經過小鳥流到另一條線。這樣就會有電流通過牠。",
      who: "🐡" },
    { id: "pole", x: 26, y: 112, live: true,
      label: "一腳線上<br>一腳碰電桿",
      say: "電桿是接地的。碰到線又碰到電桿，電就從小鳥身上流進地裡，一樣繞成一圈。",
      who: "🐡" },
    { id: "ground", x: 80, y: 186, live: true,
      label: "碰到線<br>又碰到地",
      say: "只要一邊碰線、另一邊碰到地，圈圈就接起來了。人踩在地上碰到電線，就是這一種。",
      who: "🐡" },
    { id: "air", x: 46, y: 186, live: false,
      label: "只在空中<br>沒碰到線",
      say: "什麼都沒碰到，當然不會有電流。電不會自己跳出來追牠。",
      who: "🐢" }
  ];

  var stage = document.getElementById("stage");
  var bird = document.getElementById("bird");
  var w1 = document.getElementById("w1");
  var w2 = document.getElementById("w2");
  var verdict = document.getElementById("verdict");
  var say = document.getElementById("say");
  var who = document.getElementById("who");
  var dots = document.getElementById("dots");
  var doneEl = document.getElementById("done");
  var tip = document.getElementById("tip");

  var tried = {};
  var slots = [];
  var home = { x: 89, y: 20 };      // 待命區，右上角，不壓到任何一個框

  SPOTS.forEach(function (s, i) {
    var el = document.createElement("div");
    el.className = "slot";
    el.style.left = s.x + "%";
    el.style.top = s.y + "px";
    el.innerHTML = s.label;
    el.addEventListener("click", function () { land(i); });
    stage.appendChild(el);
    slots.push(el);
  });

  function place(x, y) {
    bird.style.left = x + "%";
    bird.style.top = y + "px";
  }
  place(home.x, home.y);

  function land(i) {
    var s = SPOTS[i];
    place(s.x, s.y);
    slots.forEach(function (el, k) { el.classList.toggle("on", k === i); });

    w1.classList.toggle("live", s.live);
    w2.classList.toggle("live", s.live);
    bird.classList.remove("zap");
    if (s.live) { void bird.offsetWidth; bird.classList.add("zap"); }

    verdict.className = "verdict " + (s.live ? "live" : "safe");
    verdict.textContent = s.live ? "⚡ 圈圈接起來了，有電流通過"
                                 : "✅ 圈圈沒接起來，沒有電流";
    who.textContent = s.who;
    say.textContent = s.say;

    if (!tried[s.id]) {
      tried[s.id] = true;
      var n = Object.keys(tried).length;
      doneEl.textContent = n;
      dots.textContent = "●".repeat(n) + "○".repeat(5 - n);
      if (n === 5) {
        tip.innerHTML = "<b>五個都試過了。</b>" +
          "只要電有辦法從小鳥身上「進去再出來」，牠就會觸電；" +
          "兩腳同一條線做不到這件事。";
      }
    }
  }

  // 拖曳：放開時吸到最近的位置
  var dragging = false;
  function pt(e) { return e.touches ? e.touches[0] : e; }

  bird.addEventListener("pointerdown", function (e) {
    dragging = true;
    bird.classList.add("dragging");
    bird.setPointerCapture(e.pointerId);
  });

  bird.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var r = stage.getBoundingClientRect();
    var p = pt(e);
    var x = (p.clientX - r.left) / r.width * 100;
    var y = p.clientY - r.top;
    place(Math.max(6, Math.min(94, x)), Math.max(14, Math.min(r.height - 14, y)));
    var near = nearest();
    slots.forEach(function (el, k) { el.classList.toggle("hot", k === near); });
  });

  bird.addEventListener("pointerup", function () {
    if (!dragging) return;
    dragging = false;
    bird.classList.remove("dragging");
    slots.forEach(function (el) { el.classList.remove("hot"); });
    land(nearest());
  });

  function nearest() {
    var bx = parseFloat(bird.style.left);
    var by = parseFloat(bird.style.top);
    var best = 0, bd = Infinity;
    var w = stage.getBoundingClientRect().width || 1;
    SPOTS.forEach(function (s, i) {
      // x 是百分比、y 是像素，先把 x 換算成像素才能比距離
      var dx = (s.x - bx) / 100 * w;
      var dy = s.y - by;
      var d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
})();
</script>
</body>
